<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}School Schedule{% endblock %}</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- HTMX для динамических запросов -->
    <script src="https://unpkg.com/htmx.org@1.9.6"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Кастомные стили -->
    <link rel="stylesheet" href="{{ url_for('static', path='/css/style.css') }}">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6',
                        secondary: '#64748b',
                        success: '#22c55e',
                        danger: '#ef4444',
                        warning: '#f59e0b',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- Навигация -->
    <nav class="bg-white shadow-lg border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <i class="fas fa-school text-2xl text-primary mr-3"></i>
                    <span class="font-bold text-xl text-gray-800">School Schedule</span>
                </div>
                
                <div class="flex items-center space-x-4">
                    <a href="/" class="nav-link {% if request.url.path == '/' %}active{% endif %}">
                        <i class="fas fa-home"></i> Главная
                    </a>
                    <a href="/teachers" class="nav-link {% if 'teachers' in request.url.path %}active{% endif %}">
                        <i class="fas fa-chalkboard-teacher"></i> Учителя
                    </a>
                    <a href="/subjects" class="nav-link {% if 'subjects' in request.url.path %}active{% endif %}">
                        <i class="fas fa-book"></i> Предметы
                    </a>
                    <a href="/classes" class="nav-link {% if 'classes' in request.url.path %}active{% endif %}">
                        <i class="fas fa-user-graduate"></i> Классы
                    </a>
                    <a href="/rooms" class="nav-link {% if 'rooms' in request.url.path %}active{% endif %}">
                        <i class="fas fa-door-closed"></i> Кабинеты
                    </a>
                    <a href="/load" class="nav-link {% if 'load' in request.url.path %}active{% endif %}">
                        <i class="fas fa-tasks"></i> Нагрузка
                    </a>
                    <a href="/schedule" class="nav-link {% if 'schedule' in request.url.path %}active{% endif %}">
                        <i class="fas fa-calendar-alt"></i> Расписание
                    </a>
                    <a href="/generate" class="nav-link {% if 'generate' in request.url.path %}active{% endif %}">
                        <i class="fas fa-magic"></i> Генерация
                    </a>
                    <a href="/events" class="nav-link {% if 'events' in request.url.path %}active{% endif %}">
                        <i class="fas fa-exchange-alt"></i> Замены
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Основной контент -->
    <main class="max-w-7xl mx-auto px-4 py-8">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-gray-200 mt-12">
        <div class="max-w-7xl mx-auto px-4 py-6">
            <p class="text-center text-gray-600">
                School Schedule Manager v1.0 | 
                <a href="https://github.com/Tiborium/School_timesheet" class="text-primary hover:underline">
                    GitHub
                </a>
            </p>
        </div>
    </footer>

    <script src="{{ url_for('static', path='/js/app.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
